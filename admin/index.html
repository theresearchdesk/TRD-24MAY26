<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Portal | The Research Desk</title>
    <link rel="icon" type="image/png" href="https://theresearchdesks.com/TRD-icon.png">
    <style>
        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            overflow: hidden;
            background: #0b0b0e;
        }
        iframe {
            width: 100%; height: 100vh;
            border: none; display: block;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .loader-container {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #0b0b0e; z-index: 10;
            transition: opacity 0.5s ease;
        }
        .portal-loader {
            width: 40px; height: 40px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #f5f5f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        .loader-text {
            color: #f5f5f7; font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="portal-loader"></div>
        <div class="loader-text">Loading Admin Portal...</div>
    </div>
    <iframe id="portal-frame"
        src="https://script.google.com/macros/s/AKfycbzvEFmzr651xkZHbBKzyrE2TZSjHCzypmXijWcfXD_mUAo4QmW3Sgasv1zbxODuaZsO/exec"
        onload="document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none',500); document.getElementById('portal-frame').style.opacity='1';">
    </iframe>
</body>
</html>
